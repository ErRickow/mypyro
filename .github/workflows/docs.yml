name: Build and Deploy Documentation

on: [push, pull_request]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      - name: Generate MTProto API and Errors
        run: |
          # Menjalankan compiler untuk generate raw types dan exceptions
          cd compiler/api && python3 compiler.py
          cd ../errors && python3 compiler.py
          cd ../..

      - name: Install Package
        run: |
          # Install setelah API di-generate agar file raw.all tersedia
          pip install -e .

      - name: Build Sphinx Documentation
        run: |
          mkdir -p docs/build
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          sphinx-build -b html docs/source docs/build/html

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-docs
          path: docs/build/html/

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/beta')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
          publish_branch: gh-pages
          force_orphan: true
